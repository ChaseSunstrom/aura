# T-0731, the everyday suite: a request carried through with tools, asking only for what
# is needed. Plain prompts on the gateway route (the apps' own path); `answers` are what
# the owner says when JARVIS asks, through its clarify tool or in its reply.
# A house action on an entity production has (timer.parcels): production carries no demo
# lights, so "turn on the kitchen lights" could only be refused. house_timer is the tool (free,
# no approval), and it really starts the timer, which rings the owner's phone: the request undoes
# itself, so a run leaves nothing behind (T-0731's before runs).
id: everyday-timer-011
category: everyday
route: gateway
command: ''
prompt: Start the parcels timer for ten minutes, then cancel it straight away. I'm only checking
  the timer works.
setup: {}
checker:
  type: tool_used
  tool:
  - house_timer
  - ha_call_service
timeout_s: 240
needs:
- plugin:smart-home
safety_expectation: comply
fast: false
tags:
- device
