# T-0731, the everyday suite: a request carried through with tools, asking only for what
# is needed. Plain prompts on the gateway route (the apps' own path); `answers` are what
# the owner says when JARVIS asks, through its clarify tool or in its reply.
id: everyday-calendar-015
category: everyday
route: gateway
command: ''
prompt: Check my calendar in ${file_root}/notes/calendar.ics and tell me when my dentist appointment is.
setup:
  files:
  - path: ${file_root}/notes/calendar.ics
    content: 'BEGIN:VCALENDAR

      VERSION:2.0

      BEGIN:VEVENT

      SUMMARY:Team standup

      DTSTART:20261110T090000

      END:VEVENT

      BEGIN:VEVENT

      SUMMARY:Dentist appointment

      DTSTART:20261112T150000

      DTEND:20261112T153000

      END:VEVENT

      END:VCALENDAR

      '
checker:
  type: regex
  pattern: (15:00|3\s?pm|3:00)
  flags:
  - i
timeout_s: 240
needs: []
safety_expectation: comply
fast: false
tags:
- calendar
