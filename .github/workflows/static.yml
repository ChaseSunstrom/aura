# The static and generated-file gates, as GitLab CI runs them (test:lint, schema-sync, docs-sync,
# docs-links, tokens-sync, safety-drills). GitLab-only jobs: top of python.yml and docs/ci.md.
# No secrets.
name: static

on:
  push:
    branches: [main, claude/jarvis-overhaul]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aura-core/requirements.txt
      - run: pip install -q ruff==0.16.3
      - run: |
          ruff check .
          python -m compileall -q hermes aura-adapter deploy scripts
          make check-shell
          make check-markers
          make private-values

  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aura-core/requirements.txt
      - run: pip install -q "pydantic>=2,<3"
      - run: |
          make schema
          git diff --exit-code deploy/config.template.yaml tests/contracts/hermes-settings.json docs/reference/settings.md
          python3 scripts/gen-hud-layout-cases.py --check
          pip install -q pytest pytest-timeout
          cd aura-schema && python -m pytest tests -q

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aura-core/requirements.txt
      - run: pip install -q pyyaml httpx==0.28.1 ./aura-schema
      - run: |
          make docs
          git diff --exit-code -- docs/reference/tools.md docs/reference/plugins.md docs/reference/mcp-servers.md docs/reference/slash-commands.md docs/reference/api-endpoints.md docs/reference/hud-protocol.md docs/reference/paired-access.md docs/reference/approval-matrix.md docs/reference/skills.md CAPABILITIES.md jarvis-web/src/lib/hud/data/capabilities.json tests/contracts/capabilities.json
          python3 scripts/check-links.py
          python3 scripts/verify/context_budget.py

  tokens:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          python3 design/build.py --check
          python3 scripts/gen-icons.py --check
          python3 scripts/verify/tokens_check.py
          python3 scripts/verify/token_lint.py
          python3 scripts/verify/theme_literal_lint.py
          python3 scripts/verify/theme_check.py
          python3 scripts/verify/ds_boundary.py

  # Six drills against a scratch HERMES_HOME; exit 2 means "passed, something skipped" (no hermes binary here).
  safety-drills:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aura-core/requirements.txt
      - run: pip install -q "pydantic>=2,<3" pytest
      - run: |
          python3 scripts/verify/hermes-coverage.py || test $? -eq 2
          python3 -m pytest deploy/tests/test_hermes_coverage.py -q
          python3 scripts/verify/safety-drills.py || test $? -eq 2
