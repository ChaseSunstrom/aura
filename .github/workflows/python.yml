# The offline Python gates, as GitLab CI runs them (.gitlab-ci.yml, .gitlab/ci/quality-python.yml).
# GitLab-only, on purpose (docs/ci.md says why): the deploy and the post-deploy console check,
# the frame-budget HUD jobs (hud-frametime and its neighbours: calibrated on the owner's host),
# the benchmark (bench:mr, bench:nightly), the image builds to the private registry, the
# integration smoke, the plugin-discovery job (the Hermes image), the APK signing and release
# (apk:build, apk:release) and the signed desktop release jobs. deploy/tests/test_github_workflows.py
# fails when a GitLab job is neither mirrored here nor named there as GitLab-only.
#
# No secrets: nothing here reads one, so a fork runs the same gates.
name: python

on:
  push:
    branches: [main, claude/jarvis-overhaul]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugins:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aura-core/requirements.txt
      - run: |
          pip install -q pytest pytest-timeout ruff==0.16.3 httpx==0.28.1 websockets==15.0.1 fastapi "uvicorn[standard]" pyyaml trafilatura==2.2.0 "pillow>=10.1"
          pip install -q ./aura-schema
      - run: cd hermes && python -m pytest plugins -q --timeout=120 --timeout-method=signal

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aura-core/requirements.txt
      - run: pip install -q pytest pytest-timeout pytest-asyncio websockets==15.0.1
      # The end-to-end suite boots the real house through testing/harness.
      - run: pip install -q -r aura-core/requirements.txt -r testing/requirements.txt
      - run: cd aura-desktop && python -m pytest tests -q --timeout=120 --timeout-method=signal
      # AURA_E2E_REQUIRED: a harness that cannot be imported is an error here, not a skip (T-1440).
      - run: cd aura-desktop && AURA_E2E_REQUIRED=1 python -m pytest tests_e2e -q --timeout=120 --timeout-method=signal

  cosyvoice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aura-core/requirements.txt
      - run: pip install -q pytest pytest-timeout fastapi "uvicorn[standard]" httpx==0.28.1 numpy
      - run: cd aura-voice && python -m pytest tests -q --timeout=120 --timeout-method=signal

  adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aura-adapter/requirements.txt
      # The last install is the file the adapter's image installs, all exact pins, so the
      # suite runs against what production runs (T-1460; tests/test_image_versions.py fails
      # where they differ). pytest-asyncio: the suite has async tests (T-1442).
      - run: |
          pip install -q pytest pytest-timeout pytest-asyncio ruff==0.16.3 pyyaml trafilatura==2.2.0 "pillow>=10.1"
          pip install -q ./aura-schema
          pip install -q -r aura-adapter/requirements.txt
      - run: cd aura-adapter && python -m pytest tests -q --timeout=120 --timeout-method=signal

  config-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aura-core/requirements.txt
      - run: |
          pip install -q pytest pytest-timeout ruff==0.16.3 httpx==0.28.1 websockets==15.0.1 fastapi "uvicorn[standard]" pyyaml trafilatura==2.2.0 "pillow>=10.1"
          pip install -q ./aura-schema
      # The pinned age (T-0568): test_backup.py encrypts and drills a real backup with it.
      - run: |
          bash scripts/install-age.sh "$HOME/.age/bin"
          echo "$HOME/.age/bin" >> "$GITHUB_PATH"
      - run: python -m pytest deploy/tests scripts/media/tests -q --timeout=120

  # The house service's suite and the offline evals: `make test` runs them locally, and GitLab
  # runs them as test:core and test:tools (T-1459), which the deploy's smoke needs.
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            aura-core/requirements.txt
            testing/requirements.txt
      - run: pip install -q pytest pytest-asyncio pytest-timeout -r aura-core/requirements.txt -r testing/requirements.txt -e aura-desktop -e aura-schema
      - run: make test-core

  tools-and-evals:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aura-core/requirements.txt
      - run: pip install -q pytest pytest-asyncio pytest-timeout -r aura-core/requirements.txt -r testing/requirements.txt -e aura-desktop -e aura-schema
      - run: |
          make test-tools
          make eval-routing
          make eval-resolution
          python -m pytest bench/tests -q --timeout=120 --timeout-method=signal

  # The defect-only gates, one job each so a red one names itself (quality-python.yml).
  mypy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aura-core/requirements.txt
      - run: pip install -q mypy==2.3.1
      - run: |
          mypy --config-file mypy.ini aura-adapter/aura_adapter aura-core/aura aura-desktop/aura_desktop bench aura-schema/aura_schema
          bash scripts/mypy-plugins.sh

  vulture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aura-core/requirements.txt
      - run: pip install -q vulture==2.16
      - run: |
          vulture --min-confidence 80 aura-core/aura aura-adapter/aura_adapter aura-desktop/aura_desktop bench hermes/plugins scripts deploy vulture-allowlist.py
          python3 scripts/verify/vulture-allowlist-check.py vulture-allowlist.py aura-core/aura aura-adapter/aura_adapter aura-desktop/aura_desktop bench hermes/plugins scripts deploy aura-voice/aura_voice

  pylint-dup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aura-core/requirements.txt
      - run: pip install -q pylint==4.0.8
      - run: pylint --rcfile=pylintrc aura-core/aura aura-adapter/aura_adapter hermes/plugins aura-schema/aura_schema

  pip-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aura-core/requirements.txt
      - run: pip install -q pip-audit==2.10.1
      - run: pip-audit -r aura-core/requirements.txt -r testing/requirements.txt -r aura-adapter/requirements.txt
