# The phone's gates, as GitLab CI runs them (.gitlab-ci.yml test:android, quality-android.yml,
# the unit-test steps of android-apk.yml). The APK signing, release and screenshot goldens stay
# GitLab-only (list at the top of python.yml, docs/ci.md). No secrets: android-deps needs an NVD
# key and is not mirrored. The JDK and SDK come from android-app/tools/bootstrap-toolchain.sh,
# the same script GitLab runs, cached under $HOME.
name: android

on:
  push:
    branches: [main, claude/jarvis-overhaul]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_HOME: /home/runner/.local/jdk
  ANDROID_HOME: /home/runner/Android/Sdk

jobs:
  mirrors:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aura-core/requirements.txt
      - run: make test-android

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /home/runner/.local/jdk
            /home/runner/Android/Sdk
          key: android-toolchain-${{ hashFiles('android-app/tools/bootstrap-toolchain.sh') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /home/runner/.gradle/caches
            /home/runner/.gradle/wrapper
          key: gradle-${{ hashFiles('android-app/gradle/wrapper/gradle-wrapper.properties', 'android-app/gradle/libs.versions.toml') }}
      - run: bash android-app/tools/bootstrap-toolchain.sh
      # The pinned lint CLIs (quality-android.yml's versions).
      - run: |
          mkdir -p /home/runner/lint
          curl -fsSL -o /home/runner/lint/ktlint https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x /home/runner/lint/ktlint
          curl -fsSL -o /home/runner/lint/detekt-cli-all.jar https://repo1.maven.org/maven2/io/gitlab/arturbosch/detekt/detekt-cli/1.23.8/detekt-cli-1.23.8-all.jar
      - run: bash android-app/tools/lint.sh
        env:
          KTLINT: /home/runner/lint/ktlint
          DETEKT_JAR: /home/runner/lint/detekt-cli-all.jar

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /home/runner/.local/jdk
            /home/runner/Android/Sdk
          key: android-toolchain-${{ hashFiles('android-app/tools/bootstrap-toolchain.sh') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /home/runner/.gradle/caches
            /home/runner/.gradle/wrapper
          key: gradle-${{ hashFiles('android-app/gradle/wrapper/gradle-wrapper.properties', 'android-app/gradle/libs.versions.toml') }}
      - run: bash android-app/tools/bootstrap-toolchain.sh
      - run: |
          cd android-app
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
          ./gradlew :car-protocol:test :car-transport:test :car-dash:test :car-voice:test :car-emulator:test checkNoGms --no-daemon --stacktrace
