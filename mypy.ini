# Repo-root mypy config for the Python type gate (V2_PLAN §3.6).
#
# Deliberately pragmatic, not strict: the gate exists to catch real None/type bugs, not to force a
# full annotation sweep. `disallow_untyped_defs`/`strict` would add hundreds of *style* findings that
# are not defects (mirrors ruff.toml's defect-only stance). Raise per-tree once a tree is at zero.
#
# No third-party stubs are installed here or on CI, so `ignore_missing_imports` keeps the gate about
# our code, not about missing stub packages.
[mypy]
python_version = 3.11
ignore_missing_imports = True
namespace_packages = True
explicit_package_bases = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
# Tests are checked by pytest, not typed: excluding them keeps the gate on shipped code. The regex
# matches a top-level `tests/`/`tests_e2e/` (bench/tests, aura-core/tests, aura-desktop/tests_e2e)
# and a plugin's own `<pkg>/tests/` (surfaced only when the per-dir plugins run reaches them, see
# scripts/mypy-plugins.sh).
exclude = (^|/)tests(_e2e)?/

# `mypy hermes/plugins` FATALs (exit 2) on the hyphenated plugin directory names and prints zero
# errors — the false "plugins 0" recorded in the v2 baseline audit. The gate runs one mypy per
# plugin, each under a valid package alias, via scripts/mypy-plugins.sh. Do not replace that with a
# bare `mypy hermes/plugins`.

# Belt-and-suspenders for any test module that still resolves under a package path.
[mypy-tests.*]
ignore_errors = True

[mypy-*.tests.*]
ignore_errors = True
