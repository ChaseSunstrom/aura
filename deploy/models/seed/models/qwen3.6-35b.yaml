# The second model: Qwen3.6 35B-A3B GPTQ int4, 48k context, both cards.
# Loaded on demand; swapping to it unloads qwen3.8-27b. ttl 600: unloaded after ten idle minutes.
models:
  qwen3.6-35b:
    name: Qwen3.6 35B-A3B (GPTQ int4)
    ttl: 600
    env:
      - NCCL_P2P_DISABLE=1
      - TRITON_LIBCUDA_PATH=/usr/lib/x86_64-linux-gnu
    cmd: >
      vllm serve palmfuture/Qwen3.6-35B-A3B-GPTQ-Int4 --port ${PORT}
      --served-model-name qwen3.6-35b --max-model-len 48000
      --kv-cache-dtype fp8_e5m2 --gpu-memory-utilization 0.75 --tensor-parallel-size 2
      --enable-auto-tool-choice --tool-call-parser qwen3_xml --reasoning-parser qwen3
      --enable-prefix-caching
