# The docs gates (V2_PLAN §3.4). Included once from .gitlab-ci.yml.
#
# Two blocking jobs, the CI half of `make docs-check`:
#   docs-sync   regenerates docs/reference/* and CAPABILITIES.md with scripts/gen-docs.py and
#               fails if a committed copy drifts — the same generate-and-check contract as
#               tokens-check and schema-sync. The generator reads only the tree (config template,
#               the plugins' register() calls against a recording ctx, the adapter and console
#               routes, bench/tasks), so it needs the plugins' import-time deps and nothing live.
#   docs-links  scripts/check-links.py — every relative link, image and #anchor under docs/ and
#               in the root markdown resolves. stdlib only; no docs toolchain to install.
#
# Why two jobs and not one: a stale generated page and a broken link are different failures
# with different fixes (`make docs` and commit, versus edit the link), and a red job should say
# which one it is without reading the log.
#
# settings.md is regenerated by schema-sync (quality-python.yml, D17); docs-sync only links it.

.docs-quality:
  stage: test
  needs: []
  image: python:3.12.16-slim-bookworm
  allow_failure: false
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache: {key: pip-py312, paths: [.cache/pip]}
  rules:
    - if: $CI_COMMIT_TAG =~ /^desktop-v/
      when: never
    - when: on_success

docs-sync:
  extends: .docs-quality
  before_script:
    - apt-get update -qq && apt-get install -y -qq make git >/dev/null
    # pyyaml for the config template and the bench tasks; httpx because the plugins import it
    # at module load (the recording ctx never calls it).
    # scripts/gen-docs.py imports the plugins, and the plugins import aura_schema (D17).
    - pip install -q pyyaml httpx==0.28.1 ./aura-schema
  script:
    - make docs
    # The generated pages only (the Makefile's DOCS_GENERATED): docs/reference/ also holds
    # authored pages and schema-sync's settings.md, which are not this job's to judge.
    - git diff --exit-code -- docs/reference/tools.md docs/reference/plugins.md docs/reference/mcp-servers.md docs/reference/slash-commands.md docs/reference/api-endpoints.md docs/reference/hud-protocol.md docs/reference/paired-access.md docs/reference/approval-matrix.md docs/reference/skills.md CAPABILITIES.md jarvis-web/src/lib/hud/data/capabilities.json tests/contracts/capabilities.json

docs-links:
  extends: .docs-quality
  script:
    - python3 scripts/check-links.py
    # What every Claude Code session loads (root CLAUDE.md, always-on rules, skills): stdlib only.
    - python3 scripts/verify/context_budget.py
