# JARVIS Capability Benchmark (JCB) — the v2 plan §2.7 / D15.
#
# Two jobs, both in the `integration` stage (the root .gitlab-ci.yml owns the stage list
# [test, build, integration, deploy] and this file is only included, never edits it):
#
#   bench:mr       merge-request pipelines — the `fast` subset (~1 task per category, no
#                  swap, no external-service dependence). A few minutes. Fails the MR when
#                  the subset regresses more than 2 points against the committed baseline.
#   bench:nightly  scheduled pipelines — the whole suite against the live stack, results
#                  and the Markdown report kept as artifacts for 90 days and trended.
#
# Both bring the freshly built images up with deploy/docker-compose.yml exactly as
# integration:smoke does (same .env, same CI_STACK_IP bridge address, same jarvis runner),
# then point the harness at the API server (:8642) and adapter (:8643). They both `needs:
# integration:smoke` so they run AFTER it has torn its stack down — the two stacks bind the
# same host bridge ports, so they must not be up at once (a scheduled pipeline runs
# integration:smoke too, since that job has no rules of its own).
#
# Keys mirror the compose mapping (deploy/docker-compose.yml): the API server's
# API_SERVER_KEY is HERMES_API_KEY (CI var CI_HERMES_API_KEY); the adapter's bearer is
# AURA_API_KEY (CI var CI_JARVIS_API_KEY). BENCH_EXEC reaches the agent's filesystem for
# the file_exists/file_contains checkers, like integration:smoke's SMOKE_EXEC.

.bench-stack:
  extends: .docker
  stage: integration
  image: docker:27-cli
  # The stack asks production's llama-swap (LLM_URL below), and a deploy that changes
  # jarvis-models recreates it: pipeline 646's deploy:production did at 18:41, inside
  # bench:mr's run, and every case in the four-minute cold start timed out (T-0420).
  # deploy:production holds the same group, so GitLab runs them one at a time.
  resource_group: jarvis-models
  variables:
    COMPOSE_PROJECT_NAME: jarvis-bench-$CI_PIPELINE_IID
    DOCKER_HOST: unix:///var/run/docker.sock
    CI_STACK_IP: 172.17.0.1
  before_script:
    # .docker's own before_script (daemon check + registry login) is replaced by this one,
    # so repeat those two lines, then add the Python bench deps and bring the stack up.
    - docker info --format 'daemon {{.ServerVersion}} on {{.Name}}'
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - apk add --no-cache bash curl jq python3 py3-pip >/dev/null && pip3 install -q --break-system-packages httpx==0.28.1 websockets==15.0.1 pyyaml
    # Sweep a stack a killed job left behind (holds the bridge ports); never matches the
    # live stack (`jarvis`, `jarvis-adapter`, …) or integration's `jarvis-ci-*`.
    - docker ps -aq --filter 'name=^jarvis-bench-' | xargs -r docker rm -f >/dev/null; docker volume ls -q --filter 'name=^jarvis-bench-' | xargs -r docker volume rm >/dev/null 2>&1 || true; docker network ls -q --filter 'name=^jarvis-bench-' | xargs -r docker network rm >/dev/null 2>&1 || true
    - cd "$CI_PROJECT_DIR/deploy"
    - |
      cat > .env <<EOF
      AURA_REGISTRY=$IMAGE_BASE
      AURA_TAG=$CI_COMMIT_SHORT_SHA
      TAILSCALE_IP=$CI_STACK_IP
      AURA_CORS_ORIGINS=http://$CI_STACK_IP:8199
      AURA_PUBLIC_URL=http://$CI_STACK_IP:8643
      TZ=UTC
      AURA_API_KEY=$CI_JARVIS_API_KEY
      HERMES_API_KEY=$CI_HERMES_API_KEY
      HERMES_SERVE_TOKEN=$CI_HERMES_SERVE_TOKEN
      LLM_URL=http://host.docker.internal:9000/v1
      LLM_API_KEY=$CI_LLM_API_KEY
      LLM_MODEL=qwen3.8-27b
      LLM_CONTEXT_LENGTH=262144
      LLAMA_SWAP_URL=http://host.docker.internal:9000
      GOALS_MAX_TURNS=20
      WHISPER_MODEL=small
      PIPER_VOICE=en_GB-alan-medium
      HASS_URL=http://host.docker.internal:8080
      HASS_TOKEN=$CI_HASS_TOKEN
      SEARXNG_URL=http://searxng:8080
      SEARXNG_SECRET=ci-searxng-secret
      EXTRACT_URL=http://jarvis-extract:8896
      EXTRACT_TIMEOUT=45
      EXTRACT_ENABLED=true
      GRAFANA_URL=https://grafana.${CI_SERVER_HOST#gitlab.}
      N8N_URL=https://n8n.${CI_SERVER_HOST#gitlab.}
      GITLAB_API_URL=$CI_API_V4_URL
      MCP_GITLAB_ENABLED=false
      AURA_URL=http://host.docker.internal:8080
      AURA_TOKEN=$CI_HASS_TOKEN
      AURA_CONSOLE_PASSWORD=ci-console-$CI_JOB_ID
      BACKUP_DIR=/tmp/jarvis-bench-backups
      BACKUP_KEEP=1
      EOF
    # Named, as integration:smoke names them: the whole file also starts jarvis-cosyvoice,
    # whose 127.0.0.1:8890 is production's on this runner-and-host, and a second one would
    # pull ~8 GB and load 9 GB onto the card production's voice is capped on. `up` failed on
    # that bind and took the job down in 30-40 s on every MR pipeline since 401. searxng is
    # kept, unlike the smoke: the search tasks need it.
    - docker compose pull --quiet jarvis jarvis-adapter jarvis-web jarvis-extract searxng && docker compose up -d --remove-orphans jarvis jarvis-adapter jarvis-web jarvis-extract searxng
    - |
      for i in $(seq 1 60); do
        curl -fsS -m 5 http://$CI_STACK_IP:8642/health >/dev/null 2>&1 && curl -fsS -m 5 http://$CI_STACK_IP:8643/health >/dev/null 2>&1 && break
        sleep 5
      done
      docker compose ps
    - cd "$CI_PROJECT_DIR"
    - export BENCH_API_BASE=http://$CI_STACK_IP:8642 BENCH_API_KEY=$CI_HERMES_API_KEY
    - export BENCH_WS_BASE=http://$CI_STACK_IP:8643 BENCH_WS_KEY=$CI_JARVIS_API_KEY
    - export BENCH_EXEC="docker exec $COMPOSE_PROJECT_NAME" BENCH_WORK_ROOT=/opt/data/work BENCH_FILE_ROOT=/opt/data
    # The JCB fixture server (bench/fixtures/server.py, stdlib only) must answer on the
    # bridge address for the browser/safety/multimodal tasks: they address it as
    # host.docker.internal:8899 from the agent container, and the harness resets it over
    # the same bridge IP. The job runs on the host network (setup-runner.sh), so binding
    # 0.0.0.0:8899 here is the host's 8899. A server already answering there (the dev box
    # keeps one for spot checks) is reused rather than fought over — the per-task reset
    # isolates state either way.
    - export BENCH_FIXTURE_BASE=http://$CI_STACK_IP:8899
    - |
      if ! curl -fsS -m 3 "$BENCH_FIXTURE_BASE/" >/dev/null 2>&1; then
        nohup python3 bench/fixtures/server.py --port 8899 --state "/tmp/jcb-fixtures-$CI_PIPELINE_IID" > "$CI_PROJECT_DIR/jcb-fixtures.log" 2>&1 &
        for i in $(seq 1 20); do curl -fsS -m 3 "$BENCH_FIXTURE_BASE/" >/dev/null 2>&1 && break; sleep 1; done
      fi
      # Not curl piped into head: head closes the pipe after 200 bytes, curl exits 23 on the
      # write, and pipefail failed the job once the page outgrew that (pipeline 723).
      page="$(curl -fsS -m 3 "$BENCH_FIXTURE_BASE/")"
      printf '%.200s\n' "$page"
  after_script:
    # Absolute paths: after_script shares one shell and a second `cd deploy` from inside
    # deploy/ would fail (the integration job's pipeline 20→23 bug), leaving the stack up.
    - pkill -f 'bench/fixtures/server.py' || true
    - cd "$CI_PROJECT_DIR/deploy" && docker compose logs --no-color --tail=200 jarvis jarvis-adapter > "$CI_PROJECT_DIR/bench-stack-logs.txt" 2>&1 || true
    - cd "$CI_PROJECT_DIR/deploy" && docker compose down -v --remove-orphans || true

bench:mr:
  extends: .bench-stack
  needs: [build:jarvis, build:adapter, build:web, build:extract, integration:smoke]
  # Only a change the benchmark can see: its corpus and runner, or the plugins and image it exercises.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - bench/**/*
        - hermes/plugins/**/*
        - .gitlab/ci/bench.yml
  script:
    # The fast subset, gated at 2 points against the committed baseline. A missing
    # baseline (before the first baseline run is recorded) passes the gate with a note.
    - python3 -m bench validate --tasks-root bench/tasks
    - python3 -m bench run --subset fast --gate 2 --out bench/results --previous bench/results/baseline.json
  artifacts:
    name: bench-mr-$CI_COMMIT_SHORT_SHA
    paths: [bench/results/, bench-stack-logs.txt]
    when: always
    expire_in: 30 days

bench:nightly:
  extends: .bench-stack
  needs: [build:jarvis, build:adapter, build:web, build:extract, integration:smoke]
  # 66 tasks against a 27-B model on one box do not fit in the project's default
  # hour: pipeline 168's nightly was killed at exactly 3600 s, mid-run, and the
  # stack it had brought up stayed on this host for nine hours (a killed job's
  # `after_script` did not tear it down). The sweep below is the other half.
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - python3 -m bench validate --tasks-root bench/tasks
    - python3 -m bench run --gate 2 --out bench/results --previous bench/results/baseline.json
  artifacts:
    name: bench-nightly-$CI_COMMIT_SHORT_SHA
    paths: [bench/results/, bench-stack-logs.txt]
    when: always
    expire_in: 90 days
