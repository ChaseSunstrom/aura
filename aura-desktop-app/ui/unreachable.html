<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Jarvis</title>
		<link rel="stylesheet" href="fonts.css" />
		<link rel="stylesheet" href="tokens.css" />
		<link rel="stylesheet" href="themes.css" />
		<link rel="stylesheet" href="app.css" />
	</head>
	<body>
		<main class="ask projection" role="status">
			<span class="label"><span class="glyph" id="glyph" aria-hidden="true"></span> Offline</span>
			<h1>No console there yet</h1>
			<p class="note">Nothing answered at <span class="mono" id="url"></span>. Trying again every five seconds; the console opens here the moment it answers.</p>
			<div class="cells">
				<button class="control primary" id="change">Pair or choose another console</button>
			</div>
		</main>
		<script type="module" src="unreachable.js"></script>
	</body>
