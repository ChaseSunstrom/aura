[package]
name = "jarvis-desktop-app"
version = "1.0.0"
description = "The Jarvis desktop app: the console, the tray, approvals, pairing and the device agent in one binary (ADR-0051)."
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[workspace]
members = [".", "logic"]

[dependencies]
jarvis-desktop-logic = { path = "logic" }
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-shell = "2.3"
tauri-plugin-deep-link = "2.4"
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }
tauri-plugin-updater = "2.12"
tauri-plugin-notification = "2.4"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-autostart = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "sync"] }
url = "2"

# The webview the console runs in, for its microphone: wry leaves WebKitGTK's media stream
# off and never answers its permission request, so getUserMedia was always refused (shell.rs).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

# The same on Windows (the versions wry 0.55 itself uses).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
