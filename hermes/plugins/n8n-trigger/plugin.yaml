name: n8n-trigger
version: 0.1.0
description: "Two-way n8n at N8N_URL. Read-only: n8n_health, n8n_list_workflows, n8n_executions and n8n_get_workflow (one workflow's nodes, connections and settings, capped and told when it truncates). Behind the approval gate: n8n_trigger fires a workflow through its webhook, and n8n_create_workflow / n8n_update_workflow / n8n_activate_workflow write the workflow store through the public REST API, so JARVIS can wire up an integration as a workflow. The update prompt names the workflow by id and by name because an id alone says nothing; activation and deactivation carry separate approval keys. Only the fields the API accepts are sent, and an n8n 400 comes back with its own message verbatim. n8n_execution reads one run and what went wrong in it; n8n_delete_workflow, n8n_credential_create and n8n_credential_delete are behind the gate too (n8n_credential_schema is a read). /n8n reports health, `list` the workflows."
author: "JARVIS rebuild"
requires_env:
  - N8N_URL
hooks:
  - pre_tool_call
