name: jarvis-mail
version: 0.1.0
description: "The household mailbox over plain IMAP and SMTP (standard library only, no new dependency): mail_folders, mail_search and mail_read are read-only and use EXAMINE, so looking at mail never marks it read; search rows carry a 300-character snippet rather than a body and mail_read caps a body at 20 KB, so a mailbox cannot end up in the model's context. mail_send is the one tool that changes the world and is approval-gated, with the recipients and the subject named in the prompt. /mail reports the unread count and the newest subjects in INBOX."
author: "JARVIS rebuild"
requires_env:
  - MAIL_IMAP_HOST
hooks:
  - pre_tool_call
commands:
  - mail
provides_tools:
  - mail_folders
  - mail_search
  - mail_read
  - mail_send
