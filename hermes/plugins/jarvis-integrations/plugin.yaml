name: jarvis-integrations
version: 0.1.0
description: "Browse and install what Hermes already knows how to fetch: plugins, skills (skills.sh/ClawHub) and MCP servers (Nous catalog). integration_search/inspect/list are read-only; integration_install/update/remove/enable change an install and pass the approval gate (the message names the kind, id, source and trust). /jintegrations @<sid> search|list <kind> | inspect|install|update|remove|enable|disable <kind> <id> gives the apps the same, and every change writes logs/integrations.jsonl."
author: "JARVIS rebuild"
provides_tools:
  - integration_search
  - integration_inspect
  - integration_list
  - integration_install
  - integration_update
  - integration_remove
  - integration_enable
  - mcp_add
  - api_add
  - connector_list
  - connector_enable
  - connector_remove
  - connector_call
provides_hooks:
  - pre_tool_call
