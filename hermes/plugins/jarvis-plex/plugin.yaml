name: jarvis-plex
version: 0.1.0
description: "The household Plex server, read-only: plex_libraries lists the libraries, plex_recent what was added lately, plex_now_playing what is playing right now and for whom, plex_search finds a title by name. Nothing plays, stops or changes: there is no playback tool. Every call is a GET to PLEX_URL (https, or plain http only to a private address) with PLEX_TOKEN in the X-Plex-Token header, never in a URL; redirects are not followed, and the number of rows and the length of each title are capped."
author: "JARVIS rebuild"
requires_env:
  - PLEX_URL
provides_tools:
  - plex_libraries
  - plex_recent
  - plex_now_playing
  - plex_search
