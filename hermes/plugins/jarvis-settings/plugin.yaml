name: jarvis-settings
version: 0.1.0
description: "Read and change the settings of the one settings schema: the allow-listed Hermes keys (goals.max_turns, approvals.mode, tools.enabled/disabled, model.default, image_gen.provider, tool_loop_guardrails.*, the HUD's hud.*) through Hermes's config writer, and every env-backed leaf through the override file .storage/environment.json the entrypoint exports on the next start. settings_list/settings_get for the agent, settings_set behind the approval gate; /jsettings @<sid> get|set|list|apply|discard|proposals for the apps, where a set the matrix would ask about becomes a proposal. Every write is audit-logged to logs/settings.jsonl."
author: "JARVIS rebuild"
hooks:
  - pre_tool_call
provides_tools:
  - settings_list
  - settings_find
  - settings_get
  - settings_set
  - settings_undo
  - capability_set
