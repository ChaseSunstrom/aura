name: jarvis-jellyfin
version: 0.1.0
description: "The household Jellyfin server: jellyfin_libraries, jellyfin_search, jellyfin_resume and jellyfin_sessions are read-only browsing — libraries, titles by name and type, continue-watching positions, and which clients are connected and what they are playing. jellyfin_play is the one tool that changes the world, because something starts playing in a room somebody may be sitting in, so it is approval-gated with the item and the device named in the prompt. /jellyfin reports the libraries and any active playback. Authenticates with the JELLYFIN_TOKEN API key; JELLYFIN_USER_ID pins whose libraries are read on a multi-user server."
author: "JARVIS rebuild"
requires_env:
  - JELLYFIN_URL
hooks:
  - pre_tool_call
commands:
  - jellyfin
provides_tools:
  - jellyfin_libraries
  - jellyfin_search
  - jellyfin_resume
  - jellyfin_sessions
  - jellyfin_play
